<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Profit Board" />
<meta name="theme-color" content="#102D7F" />
<title>Profit Board · Square Foot Roofing</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="mask-icon" href="icon.svg?v=2" color="#102D7F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy:      '#102D7F',  /* brand navy — squarefootroofing.com */
          navyDeep:  '#0A1F5C',
          orange:    '#F6821F',  /* brand orange — squarefootroofing.com */
          money:     '#0E7A4A',
          moneyMark: '#17976B',
          grape:     '#9333EA',
          costMark:  '#5A6B7F',
          warn:      '#E0A100',
          danger:    '#BE2B1D',
          ink:       '#14212B',
          muted:     '#657381',
          line:      '#DCE3EB',
          shell:     '#EEF2F6'
        },
        fontFamily: { sans: ['DM Sans', 'Archivo', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] }
      }
    }
  }
</script>

<script src="config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Recharts UMD expects PropTypes as a global; without it it dies on PropTypes.oneOfType. -->
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script>
  /* Babel's stock "react" preset defaults to the automatic JSX runtime, which
     emits `import { jsx } from "react/jsx-runtime"` — invalid in a classic
     script with no bundler. Pin the classic runtime so JSX compiles down to
     React.createElement against the UMD global. */
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
  });
</script>

<style>
  :root { color-scheme: light; }
  html, body { margin:0; background:#EEF2F6; font-family:'DM Sans','Archivo',system-ui,sans-serif; color:#14212B; }
  /* Big standalone values use proportional figures; only columns get tabular. */
  .figure { font-variant-numeric: proportional-nums; letter-spacing:-.02em; }
  .tnum   { font-variant-numeric: tabular-nums; }
  .card-shadow { box-shadow: 0 10px 26px rgba(16,38,64,.10); }
  .lift        { box-shadow: 0 18px 42px rgba(16,38,64,.16); }
  input, select { font: inherit; }
  input:focus, select:focus { outline:none; border-color:#102D7F; box-shadow:0 0 0 4px rgba(16,45,127,.16); }
  .fade-in { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }
  /* Hide the tab strip's scrollbar without killing the scroll itself. */
  ::-webkit-scrollbar { height: 0; }
  @media print { .no-print { display:none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- Compiled in the browser, in order. core → app → dashboard. -->
<script type="text/babel" data-presets="react-classic" src="core.js"></script>
<script type="text/babel" data-presets="react-classic" src="charts.js"></script>
<script type="text/babel" data-presets="react-classic" src="app.js"></script>
<script type="text/babel" data-presets="react-classic" src="dashboard.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
</script>
</body>
</html>
