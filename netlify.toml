[build]
  publish = "."
  command = ""

# The app is a single static page — no build step, no framework.

[[headers]]
  for = "/config.js"
  [headers.values]
    # Carries the Supabase URL + key. Never let a CDN or browser pin an old copy,
    # or changing the key silently does nothing.
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    # Icons change when the brand changes; always check with the server first.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
